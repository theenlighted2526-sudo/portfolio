<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Underscore by Tanmay Padekar: background music that follows the scene you're reading.">
<title>Underscore</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Underscore">
<meta name="theme-color" content="#050506">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Outfit:wght@100;200&display=swap">
<style>
/* Layout: one phone-width column in a night-reading world; glow cards carry each scene's mood */
:root{
  --bg:#050506; --surface:#0F0F12; --raised:#141417; --pill:#1C1C20;
  --line:#1A1A1F; --line-2:#26262B; --line-3:#3A3A42;
  --fg:#F2F2F0; --fg-2:#A1A1AA; --fg-3:#8E8E96; --lime:#D6F26A; --amber:#F0B98A; --danger:#FF8A8A;
  --font:'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --num:'Outfit', 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --grain:none;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#app{max-width:440px;margin:0 auto;min-height:100%;position:relative}

.screen{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;
  padding-block:20px 120px;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.screen.no-nav{padding-bottom:28px}
.screen.has-dock{padding-bottom:132px}

.h1{margin:0;font-size:32px;font-weight:300;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.h2{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.title{margin:0;font-size:20px;font-weight:500;line-height:1.2}
.sub{margin:0;font-size:15px;color:var(--fg-2);line-height:1.5}
.cap{font-size:13px;color:var(--fg-3);line-height:1.3}
.label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.num{font-family:var(--num);font-weight:100;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

.iconbtn{width:44px;height:44px;box-sizing:border-box;border-radius:22px;background:var(--raised);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--fg)}
.chip{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.13);font-size:13px;font-weight:500;line-height:1.2;white-space:nowrap}
.chip.dark{background:rgba(6,8,10,.55)}

/* glow cards */
.glow{position:relative;isolation:isolate;overflow:hidden;border-radius:32px;
  background:
    radial-gradient(68% 56% at 50% 44%, rgba(3,3,5,.96) 0%, rgba(3,3,5,.7) 42%, rgba(3,3,5,0) 80%),
    radial-gradient(120% 68% at 50% 112%, var(--b) 0%, rgba(var(--c),.85) 32%, rgba(var(--c),0) 72%),
    radial-gradient(85% 70% at 0% 0%, rgba(var(--c),.85) 0%, rgba(var(--c),0) 62%),
    radial-gradient(85% 70% at 100% 0%, rgba(var(--c2),.85) 0%, rgba(var(--c2),0) 62%),
    var(--base);
  box-shadow:0 26px 60px -24px rgba(var(--c),.6), inset 0 1px 0 rgba(255,255,255,.14)}
.glow.corner{border-radius:26px;
  background:
    radial-gradient(95% 95% at 100% 105%, var(--b) 0%, rgba(var(--c),.9) 30%, rgba(var(--c),0) 72%),
    radial-gradient(80% 90% at 0% 110%, rgba(var(--c2),.75) 0%, rgba(var(--c2),0) 62%),
    var(--base);
  box-shadow:0 18px 40px -20px rgba(var(--c),.6), inset 0 1px 0 rgba(255,255,255,.12)}
.grain::after{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:96px 96px;mix-blend-mode:soft-light;opacity:.55;pointer-events:none;z-index:0;border-radius:inherit}
.glow > *{position:relative;z-index:1}

/* buttons */
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;height:60px;padding:0 6px 0 24px;box-sizing:border-box;border-radius:30px;background:var(--pill);border:1px solid #2E2E35;color:var(--fg);font-size:16px;font-weight:600;text-align:left}
.cta .dot{width:48px;height:48px;border-radius:24px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.textbtn{height:48px;border:none;background:transparent;color:var(--fg-2);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom, 0px));display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(28,28,32,.94);border:1px solid #2A2A30;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:20;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tabbar button{height:44px;padding:0 18px;border-radius:22px;border:none;background:transparent;color:#A8A8B0;font-size:14px}
.tabbar button[aria-current="page"]{background:var(--fg);color:var(--bg);font-weight:600}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;box-sizing:border-box;z-index:20;
  padding-top:40px;padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));
  background:linear-gradient(to bottom, rgba(5,5,6,0), var(--bg) 45%)}

.group{border-radius:22px;background:var(--surface);border:1px solid #1E1E23;overflow:hidden}
.group > * + *{border-top:1px solid var(--line)}
.listrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;box-sizing:border-box;width:100%;background:transparent;border:none;text-align:left}
.switch{width:60px;height:44px;flex-shrink:0;margin-right:-4px;border:none;background:transparent;display:flex;align-items:center;justify-content:center}
.switch span{position:relative;display:block;width:50px;height:30px;border-radius:15px;background:var(--line-3);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:var(--fg);transition:left .2s, background .2s}
.switch[aria-checked="true"] span{background:var(--lime)}
.switch[aria-checked="true"] span::after{left:23px;background:var(--bg)}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top, 0px));z-index:50;max-width:min(400px, calc(100% - 32px));box-sizing:border-box;padding:12px 18px;border-radius:18px;background:#1E1E23;border:1px solid var(--line-3);font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.5)}

/* home */
.shelf{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px}
.shelf .tile{height:112px;padding:14px 16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:none;color:var(--fg)}
.addtile{height:112px;border-radius:26px;border:1px dashed var(--line-3);background:#0D0D10;color:var(--fg-3);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.search-link{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;box-sizing:border-box;border-radius:26px;background:var(--raised);border:1px solid var(--line-2);color:var(--fg-3);font-size:16px;width:100%;text-align:left}

/* chapter list */
.chrow{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 16px;box-sizing:border-box;border-radius:22px;background:var(--surface);border:1px solid #1E1E23;color:var(--fg);text-align:left}
.chrow[aria-pressed="true"]{background:#18181C;border-color:var(--lime)}
.chrow .n{width:36px;flex-shrink:0;font-family:var(--num);font-weight:200;font-size:26px;line-height:1;color:var(--fg-3)}
.chrow[aria-pressed="true"] .n{color:var(--lime)}
.chrow:disabled{opacity:.5}

/* player */
.scene-card{position:relative;flex-grow:1;min-height:300px;border-radius:32px;overflow:hidden;isolation:isolate;transition:box-shadow .9s ease}
.scene-card .layer{position:absolute;inset:0;border-radius:inherit;box-shadow:none}
.scene-card .layer.in{animation:fadein .9s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.scene-card .content{position:relative;z-index:2;height:100%;box-sizing:border-box;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.glassbox{padding:14px 16px;border-radius:20px;background:rgba(6,6,8,.62);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:4px}
.sdots{display:flex;justify-content:flex-end;gap:8px;flex-grow:1;flex-wrap:wrap}
.sdot{width:44px;height:44px;border-radius:22px;border:1px solid var(--line-3);background:transparent;color:#C4C4CC;font-size:15px;font-weight:600}
.sdot[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ruler{position:relative;height:36px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;touch-action:none}
.ruler i{display:block;width:2px;border-radius:1px;height:9px;background:#26262B}
.ruler i.major{height:16px;background:var(--line-3)}
.ruler i.done{background:#5E5E66}
.ruler i.major.done{background:var(--fg-3)}
.ruler .mark{position:absolute;top:4px;width:2px;height:28px;border-radius:1px;background:var(--lime);box-shadow:0 0 10px rgba(214,242,106,.6);transform:translateX(-1px);transition:left .6s ease}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px}
.roundbtn{width:56px;height:56px;border-radius:28px;border:1px solid var(--line-2);background:var(--raised);color:var(--fg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.roundbtn:disabled{opacity:.4}
.playbtn{flex-grow:1;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 24px;border-radius:32px;border:1px solid #2E2E35;background:var(--pill);color:var(--fg);font-size:16px;font-weight:600}
.playbtn .dot{width:48px;height:48px;border-radius:24px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center}
.vote{display:flex;align-items:center;gap:8px;height:60px;padding:0 8px 0 20px;box-sizing:border-box;border-radius:30px;background:var(--surface);border:1px solid #1E1E23}
.vote button{width:44px;height:44px;flex-shrink:0;border-radius:22px;border:none;background:var(--pill);color:var(--fg);display:flex;align-items:center;justify-content:center}
.vote button[aria-pressed="true"].yes{background:var(--lime);color:var(--bg)}
.vote button[aria-pressed="true"].no{background:var(--fg);color:var(--bg)}
.hint{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 16px;border-radius:16px;background:#141417;border:1px solid var(--line-2);font-size:14px;color:var(--fg-2)}

/* sounds */
input[type=range]{width:100%;height:24px;margin:0;accent-color:var(--lime)}
.moodrow{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:0 16px;box-sizing:border-box;border:none;background:transparent;color:var(--fg);text-align:left}
.moodrow[aria-pressed="true"]{background:#16161A}
.moodrow .pp{width:36px;height:36px;flex-shrink:0;border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line-3)}
.moodrow[aria-pressed="true"] .pp{background:var(--fg);color:var(--bg);box-shadow:none}
.wave{flex-shrink:0;margin:0 2px;overflow:visible}
.wave .w{transition:filter .3s}
.moodrow[aria-pressed="true"] .wave path{animation:flow 1.4s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-21px)}}

/* stats */
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid #1E1E23}
.seg button{flex:1;height:44px;border-radius:22px;border:none;background:transparent;color:var(--fg-2);font-size:15px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px}
.bars > div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars b{display:block;width:100%;max-width:22px;border-radius:6px;background:rgba(255,255,255,.75)}
.bars span{font-size:12px;font-weight:500;line-height:1;color:#E4E4E7}
.stat{height:84px;padding:14px 16px;box-sizing:border-box;border-radius:22px;background:var(--surface);border:1px solid #1E1E23;display:flex;flex-direction:column;justify-content:space-between}

/* search */
.field{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 16px;box-sizing:border-box;border-radius:24px;background:var(--raised);border:1px solid var(--line-3);flex-grow:1;min-width:0}
.field input{flex-grow:1;min-width:0;background:transparent;border:none;outline:none;color:var(--fg);font:inherit;font-size:16px}
.field input::placeholder{color:var(--fg-3)}
.field input::-webkit-search-cancel-button{display:none}
.result{display:flex;align-items:center;gap:16px;width:100%;min-height:84px;padding:12px 0;box-sizing:border-box;border:none;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);text-align:left}
.swatch{width:48px;height:64px;flex-shrink:0;border-radius:12px}

/* AI drafting */
.cta:disabled{opacity:.5}
.chrow.unmapped .n{opacity:.55}
.draftcard,.addbox{margin-top:20px;padding:18px;border-radius:24px;background:var(--surface);border:1px solid #2E2E35;display:flex;flex-direction:column;gap:10px}
.addbox{gap:8px}
textarea,.inp{width:100%;box-sizing:border-box;background:var(--raised);border:1px solid var(--line-3);border-radius:16px;padding:12px 14px;color:var(--fg);font:inherit;font-size:16px;line-height:1.4}
textarea{resize:vertical;min-height:88px}
.inp{height:48px}
textarea::placeholder,.inp::placeholder{color:var(--fg-3)}
.err{margin:0;font-size:14px;line-height:1.4;color:var(--danger)}
.moodpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.moodpick button{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--raised);border:1px solid var(--line-2);font-size:14px;color:var(--fg)}
.moodpick button span{width:8px;height:8px;border-radius:4px;flex-shrink:0}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important}
}
</style>
</head>
<body>

<div id="app" aria-live="off"></div>
<div id="toast-slot"></div>

<script>
(function(){
'use strict';

/* ---------- grain texture ---------- */
try{
  const c=document.createElement('canvas');c.width=c.height=256;
  const x=c.getContext('2d');const d=x.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()+Math.random()-1)*34|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  x.putImageData(d,0,0);
  document.documentElement.style.setProperty('--grain','url('+c.toDataURL()+')');
}catch(e){}

/* ---------- storage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem('underscore_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('underscore_'+k,JSON.stringify(v))}catch(e){}},
  clear(){try{Object.keys(localStorage).filter(k=>k.indexOf('underscore_')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}
};

/* ---------- moods ---------- */
const MOODS={
  rain:{name:'Rain & reflection',inst:'Rain · acoustic guitar',track:'audio/rain.mp3',has:['rain'],c:'128,116,214',c2:'70,90,170',b:'#DCD6FF',base:'#0B0A1C',
    amb:[['rain',.8]],music:{root:50,scale:'minor',chords:[[0,3,7,10],[-4,0,3,7],[3,7,10,14],[-2,2,5,9]],pad:{kind:'strings',cutoff:950,level:.09},drone:{level:.035},bass:.06,lead:{inst:'piano',style:'melody',beat:1.05,oct:12,level:.16}}},
  sea:{name:'Open sea',inst:'Ocean waves · gentle melody',track:'audio/sea.mp3',has:['waves'],c:'84,186,198',c2:'70,96,190',b:'#B9F1F0',base:'#07202A',
    amb:[['waves',.9],['wind',.15]],music:{root:45,scale:'major',chords:[[0,4,7,11],[-3,0,4,7],[5,9,12,16],[7,12,14,19]],pad:{kind:'warm',cutoff:1150,level:.1},bass:.08,lead:{inst:'piano',style:'melody',beat:.8,oct:24,level:.14}}},
  wonder:{name:'Quiet wonder',inst:'Wind · bamboo flute',track:'audio/wind.mp3',has:['wind'],c:'92,176,128',c2:'60,140,150',b:'#CFF5D8',base:'#071610',
    amb:[['wind',.45]],music:{root:48,scale:'major',chords:[[0,4,7,11,14],[-3,0,4,7],[5,9,12,16],[7,11,14,16]],pad:{kind:'strings',cutoff:1300,level:.075,swell:true},bass:.06,lead:{inst:'harp',style:'arp',beat:.42,oct:12,level:.11}}},
  tension:{name:'Rising tension',inst:'Heartbeat · dark strings',c:'190,50,60',c2:'120,40,90',b:'#FFB3B3',base:'#140405',
    amb:[['heart',.7]],music:{root:49,scale:'phrygian',chords:[[0,3,7],[1,4,8],[0,3,6],[-1,3,6]],pad:{kind:'strings',cutoff:650,level:.08,swell:true},drone:{level:.08},bass:.1,lead:{inst:'piano',style:'ostinato',beat:.5,oct:-12,level:.17}}},
  hearth:{name:'Warm hearth',inst:'Fireplace · piano',track:'audio/hearth.mp3',has:['fire'],c:'232,128,64',c2:'200,70,80',b:'#FFD9B0',base:'#1A0B04',
    amb:[['fire',.8]],music:{root:55,scale:'major',chords:[[0,4,7,11],[-3,0,4,7],[5,9,12,16],[7,12,14,17]],pad:{kind:'warm',cutoff:1000,level:.07},bass:.07,lead:{inst:'guitar',style:'arp',beat:.45,oct:0,level:.2}}},
  night:{name:'Night & mystery',inst:'Calm night · piano',track:'audio/night.mp3',has:['crickets'],c:'84,100,230',c2:'120,70,200',b:'#C4CCFF',base:'#05061A',
    amb:[['crickets',.55],['wind',.1]],music:{root:52,scale:'minor',chords:[[0,3,7,14],[-4,0,3,7],[5,8,12,15],[7,12,14,17]],pad:{kind:'warm',cutoff:780,level:.07},bass:.05,lead:{inst:'bell',style:'melody',beat:.7,oct:24,level:.1}}}
};
const EXTRA={
  voyage:{name:'The call to sail',inst:'Rising horns · open ocean',c:'232,128,64',c2:'84,186,198',b:'#FFD9B0',base:'#1A0B04',
    amb:[['waves',.5],['wind',.2]],music:{root:50,scale:'major',chords:[[0,4,7,12],[5,9,12,17],[7,11,14,19],[-3,0,4,9]],pad:{kind:'brass',cutoff:1300,level:.09},drone:{level:.05},bass:.1,lead:{inst:'piano',style:'melody',beat:.6,oct:12,level:.13}}},
  party:{name:'Party lights',inst:'Crowd chatter · bright piano',c:'214,190,90',c2:'214,106,138',b:'#FFF1B0',base:'#151004',
    amb:[['room',.55]],music:{root:53,scale:'major',chords:[[0,4,7,9],[-3,0,4,7],[2,5,9,12],[7,11,14,17]],pad:{kind:'warm',cutoff:1600,level:.06},bass:.09,lead:{inst:'piano',style:'arp',beat:.28,oct:12,level:.11}}}
};
const ALL=Object.assign({},MOODS,EXTRA);
const vars=m=>`--c:${m.c};--c2:${m.c2};--b:${m.b};--base:${m.base}`;

/* ---------- books ---------- */
const COL={
  moby:{c:'84,186,198',c2:'70,96,190',b:'#B9F1F0',base:'#07202A'},
  frank:{c:'84,100,230',c2:'120,70,200',b:'#C4CCFF',base:'#05061A'},
  gatsby:{c:'150,170,80',c2:'60,130,96',b:'#EEF5A8',base:'#0A0D06'},
  pride:{c:'214,106,138',c2:'140,70,170',b:'#FFC8D4',base:'#12070C'},
  dracula:{c:'190,50,60',c2:'120,40,90',b:'#FFB3B3',base:'#140405'},
  jane:{c:'128,116,214',c2:'70,90,170',b:'#DCD6FF',base:'#0B0A1C'},
  treasure:{c:'232,128,64',c2:'200,70,80',b:'#FFD9B0',base:'#1A0B04'},
  seawolf:{c:'60,140,150',c2:'92,176,128',b:'#CFF5D8',base:'#071610'}
};

function aiErr(e){
  const c=e&&e.code;
  if(c==='cancelled')return null;
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){S.aiState='off';return 'AI mapping isn’t allowed in this view.'}
  if(c==='rate_limited')return 'Too many requests right now. Try again in a minute.';
  if(c==='session_expired')return 'Sign in to Claude again, then try once more.';
  if(c==='invalid_json'||c==='empty_completion')return 'The draft came back incomplete. Try again.';
  if(c==='refused')return 'The AI couldn’t map this chapter. Add a short note about what happens, then try again.';
  return 'Couldn’t reach the AI. Check your connection and try again.';
}
const MOOD_GUIDE='rain (melancholy, grief, reflection, grey weather), sea (calm, open spaces, travel, water), wonder (awe, hope, beauty, discovery), tension (danger, fear, suspense, conflict, chase), hearth (warmth, comfort, friendship, love, home), night (mystery, eerie quiet, secrets, darkness), voyage (resolve, setting out, triumph), party (celebration, crowds, festivity)';
const SOUND_NAMES={rain:'Rain',waves:'Waves',wind:'Wind',room:'Murmur',fire:'Fire',crickets:'Crickets',heart:'Heartbeat'};
function normalizeMap(r){
  if(!r||!Array.isArray(r.scenes))return null;
  let words=Number(r.chapterWords);if(!(words>=500&&words<=30000))words=3500;
  const sc=r.scenes.filter(s=>s&&typeof s==='object').slice(0,8);
  if(!sc.length)return null;
  const shares=sc.map(s=>{const v=Number(s.share);return v>0?v:1}),tot=shares.reduce((a,c)=>a+c,0);
  return sc.map(function(s,i){
    const mood=ALL[s.mood]?s.mood:'wonder';
    const snd=(Array.isArray(s.sounds)?s.sounds:[]).filter(x=>x&&SOUND_NAMES[x.type]).slice(0,2).map(x=>[x.type,Math.max(.1,Math.min(1,Number(x.level)||.5))]);
    const o={t:String(s.title||('Scene '+(i+1))).slice(0,40),mood:mood,d:String(s.summary||'').slice(0,90)||ALL[mood].name,w:Math.max(150,Math.round(words*shares[i]/tot))};
    if(snd.length){o.amb=snd;o.snd=snd.map(x=>SOUND_NAMES[x[0]]).join(' · ')+' · '+((ALL[mood].inst.split('·')[1])||'').trim()}
    return o;
  });
}
async function draftMap(){
  const b=bookById(S.bookId),ch=S.pickCh;
  if(!AI||!b||(S.draft&&S.draft.status==='thinking'))return;
  const ctl=new AbortController();S.draft={book:b.id,ch:ch,status:'thinking',ctl:ctl};render();
  const note=(S.notes[b.id+'-'+ch]||'').trim().slice(0,800);
  const ct=chTitle(b,ch),title=/^Chapter \d+$/.test(ct)?'':ct;
  const prompt='You are writing a soundtrack map for someone reading a book. They hear background music that changes with each scene while they read.\n\n'
    +'Book: "'+b.title+'" by '+b.author+'\nChapter: '+ch+(title?' ("'+title+'")':'')+'\n'
    +(note?'The reader describes this chapter as: '+note+'\n':'')
    +'\nSplit this chapter into 3 to 7 consecutive scenes in reading order, based on what you know of it'+(note?' and the reader’s description':'')+'. If you do not know this chapter, base it on the reader’s description or the book’s overall tone, and set confidence to "low".\n\n'
    +'Write titles and summaries in your own words. Never quote the book. Do not reveal anything that happens after this chapter.\n\n'
    +'For each scene choose exactly one mood id from this list:\n'+MOOD_GUIDE+'\n\n'
    +'Optionally add up to 2 ambient sounds the setting clearly calls for, from: rain, waves, wind, room (indoor crowd murmur), fire, crickets, heart (heartbeat, for fear). Level is 0.1 to 1. Use an empty list when nothing fits.\n\n'
    +'Reply with only JSON in this shape:\n{"chapterTitle": string or null, "chapterWords": estimated number of words in the chapter, "confidence": "high" | "medium" | "low", "scenes": [{"title": "2 to 5 words", "mood": "mood id", "summary": "under 12 words", "share": percent of the chapter, "sounds": [{"type": "rain", "level": 0.6}]}]}';
  try{
    const r=await AI.json(prompt,{signal:ctl.signal,cache:false});
    const scenes=normalizeMap(r);
    if(!scenes)throw {code:'invalid_json'};
    const conf=['high','medium','low'].indexOf(r.confidence)>=0?r.confidence:'medium';
    const meta={conf:conf};if(!(b.titles&&b.titles[ch-1])&&r.chapterTitle)meta.title=String(r.chapterTitle).slice(0,60);
    saveMap(b,ch,scenes,true,meta);
    if(b.remoteCh)delete b.remoteCh[ch];
    if(canShare())pushMap(b.id,ch,AIMAPS[b.id][ch]);
    S.draft=null;
    toast('Chapter '+ch+' mapped: '+scenes.length+' scenes');
  }catch(e){
    const m=aiErr(e);S.draft=m?{book:b.id,ch:ch,status:'error',msg:m}:null;
  }
  render();
}
async function identifyBook(q){

    const r=await AI.json('A reader typed this into a book search: "'+q.slice(0,120)+'"\nIf it clearly identifies a real, published book, reply with only JSON: {"found": true, "title": string, "author": string, "chapters": number of chapters in the standard edition}\nIf you are not sure which book it is, reply with only: {"found": false}',{signal:ctl.signal,modelTier:'quick'});
    if(r&&r.found&&r.title){
      const n=Math.max(1,Math.min(300,parseInt(r.chapters,10)||30));
      addCustom(String(r.title).slice(0,80),String(r.author||'Unknown author').slice(0,60),n,true);return;
    }
    S.adding={q:q,status:'manual'};

}
function addCustom(title,author,chapters,known){

function resolveScene(s,i){
  const sc=s.scenes[i],k=s.book+'~'+s.ch+'~'+i,mine=S.votes[k],a=AGG[k];

/* ---------- navigation ---------- */
function go(view,push){
  if(S.view==='sounds'&&view!=='sounds'&&S.preview){S.preview=null;if(!(S.session&&S.session.playing))Sound.stop(.8)}
  if(push!==false)S.stack.push(S.view);
  S.view=view;render();window.scrollTo(0,0);
}
function back(){const v=S.stack.pop()||'home';go(v,false)}

/* ---------- shelf + session ---------- */
function shelfEntry(bookId){return S.shelf.find(e=>e.book===bookId)}
function addToShelf(bookId,ch,pos){
  let e=shelfEntry(bookId);
  if(!e){e={book:bookId,ch:ch,pos:pos||0};S.shelf.unshift(e)}else{e.ch=ch;e.pos=pos||0}
  S.last={book:bookId,ch:ch};saveShelf();
}
function openSession(bookId,ch){
  const b=bookById(bookId),scenes=b.maps[ch];if(!scenes)return;
  const e=shelfEntry(bookId);
  const pos=(e&&e.ch===ch&&e.pos<chWords(scenes)-30)?e.pos:0;
  if(S.session&&S.session.playing&&(S.session.book!==bookId||S.session.ch!==ch)){Sound.stop(1.2);releaseWake()}
  if(!(S.session&&S.session.book===bookId&&S.session.ch===ch)){
    S.session={book:bookId,ch:ch,scenes:scenes,total:chWords(scenes),pos:pos,playing:false,done:false,idx:sceneAt(scenes,pos)};
  }
  addToShelf(bookId,ch,S.session.pos);
}
function sceneAt(scenes,pos){let acc=0;for(let i=0;i<scenes.length;i++){acc+=scenes[i].w;if(pos<acc)return i}return scenes.length-1}
function sceneStart(scenes,i){let acc=0;for(let k=0;k<i;k++)acc+=scenes[k].w;return acc}
function playScene(fade){
  const s=S.session,sc=resolveScene(s,s.idx),m=ALL[sc.mood];
  if(!Sound.play(m,sc.amb,fade)){toast('This browser can’t play the soundtrack.');return false}
  Sound.preload(s.scenes.map(function(x,i){const r=resolveScene(s,i);return Object.assign({},ALL[r.mood],r.amb?{amb:r.amb}:{})}));
  return true;
}
function setScene(i,opts){
  const s=S.session;i=Math.max(0,Math.min(s.scenes.length-1,i));
  const changed=i!==s.idx;s.idx=i;
  if(!(opts&&opts.keepPos))s.pos=sceneStart(s.scenes,i);
  s.done=false;
  if(changed&&s.playing){playScene(3);S.stats.scenes++;saveStats();if(S.settings.buzz&&navigator.vibrate){try{navigator.vibrate(25)}catch(e){}}}
  syncShelf();
}
function syncShelf(){const s=S.session;if(!s)return;const e=shelfEntry(s.book);if(e){e.ch=s.ch;e.pos=Math.floor(s.pos)}S.last={book:s.book,ch:s.ch};saveShelf()}
function togglePlay(){
  const s=S.session;if(!s)return;
  if(s.done){s.pos=0;s.idx=0;s.done=false}
  if(s.playing){s.playing=false;Sound.stop(1.2);releaseWake();syncShelf()}
  else{if(S.preview)S.preview=null;if(!playScene(2))return;s.playing=true;s.lastTick=Date.now();requestWake()}
  render();
}

/* wake lock */
let wake=null;
async function requestWake(){if(!S.settings.keepAwake||!('wakeLock' in navigator))return;try{wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.session&&S.session.playing&&!wake)requestWake()});

/* ticker */
let saveCount=0;
setInterval(function(){
  const s=S.session;
  if(s&&s.playing){
    const now=Date.now(),dt=Math.min(10,(now-(s.lastTick||now))/1000);s.lastTick=now;
    const wpm=S.settings.wpm;
    let pos=s.pos+wpm/60*dt;
    if(!S.settings.autoAdvance){const end=sceneStart(s.scenes,s.idx)+s.scenes[s.idx].w-1;pos=Math.min(pos,end)}
    s.pos=pos;
    const k=dayKey(new Date());S.stats.days[k]=(S.stats.days[k]||0)+dt;
    const mood=resolveScene(s,s.idx).mood;S.stats.moods[mood]=(S.stats.moods[mood]||0)+dt;
    if(s.pos>=s.total){
      s.pos=s.total;s.playing=false;s.done=true;Sound.stop(5);releaseWake();S.stats.chapters++;saveStats();syncShelf();
      if(S.view==='player')render();return;
    }
    const ni=sceneAt(s.scenes,s.pos);
    if(ni!==s.idx){setScene(ni,{keepPos:true});if(S.view==='player')render();}
    else if(S.view==='player')livePlayer();
    if(++saveCount%5===0){saveStats();syncShelf()}
  }
  if(S.view==='pace'&&S.pace.phase==='reading'){S.pace.secs=Math.floor((Date.now()-S.pace.start)/1000);const el=document.getElementById('pace-big');if(el)el.textContent=fmtClock(S.pace.secs)}
},1000);
const fmtClock=t=>pad2(Math.floor(t/60))+':'+pad2(t%60);

  if(S.pickCh==null){const e=shelfEntry(b.id);S.pickCh=(e&&b.maps[e.ch])?e.ch:(mapped[0]||1)}

  const fromOther=!!(b.remoteCh&&b.remoteCh[n0]&&b.remoteCh[n0].by&&b.remoteCh[n0].by!==UID);
  const d=S.draft,drafting=!!(d&&d.status==='thinking'),errHere=!!(d&&d.status==='error'&&d.book===b.id&&d.ch===n0);
  const show=S.showAll?b.chapters:Math.min(b.chapters,Math.max(12,(mapped[mapped.length-1]||0)+3,n0+2));
  let rows='';

      ${S.aiState==='ready'?`<button type="button" class="textbtn" style="flex-shrink:0;height:44px;color:var(--fg)" data-act="draft" ${drafting?'disabled':''}>Redraft</button>`:''}</div>

  else if(S.aiState!=='off')dock=`<button type="button" class="cta" data-act="draft" ${S.aiState==='pending'?'disabled':''}>Draft chapter ${n0} with AI<span class="dot">${I.spark}</span></button>`;
  return `<div class="screen has-dock">
    <div class="row">${backBtn()}<div class="title">Choose your chapter</div></div>
    <div class="glow grain" style="${vars(c)};margin-top:24px;height:196px;flex-shrink:0;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;

      <div><h1 style="margin:0;font-size:28px;font-weight:300;line-height:1.15">${esc(b.title)}</h1><div style="font-size:15px;color:#D5DEDF">${esc(b.author)} · ${b.chapters} chapters</div></div>
      <div class="between" style="align-items:flex-end">
        <div><div class="num" style="font-size:48px">${S.settings.wpm}</div><div style="font-size:14px;color:#D5DEDF">words per minute · your pace</div></div>
        <div class="chip dark">${mapped.length?mapped.length+' mapped':'Not mapped yet'}</div>

    <h2 style="margin:0;padding:28px 0 12px;font-size:15px;font-weight:500;color:var(--fg-2)">Which chapter are you on?</h2>

    ${dock?`<div class="dock">${dock}</div>`:''}

}

function rulerHTML(s){
  const pos=s.pos/s.total,mk=Math.round(pos*40);let ticks='';
  for(let t=0;t<=40;t++)ticks+=`<i class="${t%5===0?'major':''} ${t<mk?'done':''}"></i>`;
  return ticks+`<span class="mark" style="left:${(pos*100).toFixed(2)}%"></span>`;
}

function statsData(){
  const days=S.stats.days,now=new Date(),P=S.period;let bars=[],label='';
  const sumDay=d=>(days[dayKey(d)]||0)/60;
  if(P==='week'){
    for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);bars.push(['SMTWTFS'[d.getDay()],sumDay(d)])}
    label='minutes read in the last 7 days';
  }else if(P==='month'){
    for(let w=3;w>=0;w--){let t=0,start;for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-w*7-i);if(i===6)start=d;t+=sumDay(d)}bars.push([(start.getMonth()+1)+'/'+start.getDate(),t])}
    label='minutes read in the last 4 weeks';
  }else{
    const y=now.getFullYear();
    for(let mo=0;mo<=now.getMonth();mo++){let t=0;Object.keys(days).forEach(k=>{const p=k.split('-');if(+p[0]===y&&+p[1]===mo+1)t+=days[k]/60});bars.push(['JFMAMJJASOND'[mo],t])}
    label='minutes read this year';
  }
  const total=Math.round(bars.reduce((s,b)=>s+b[1],0));
  let streak=0;for(let i=0;i<400;i++){const d=new Date(now);d.setDate(now.getDate()-i);if((days[dayKey(d)]||0)>=30)streak++;else if(i>0)break}
  const mt=S.stats.moods,mk=Object.keys(mt).sort((a,b)=>mt[b]-mt[a]),msum=mk.reduce((s,k)=>s+mt[k],0);
  return {bars,label,total,streak,moods:mk.slice(0,3).map(k=>[ALL[k].name,Math.round(mt[k]/msum*100),ALL[k].b])};
}

  const empty=!Object.keys(S.stats.days).length;
  return `<div class="screen">

      ${tile('Chapters finished',S.stats.chapters,'')}${tile('Reading streak',d.streak,d.streak===1?'day':'days')}${tile('Scenes heard',S.stats.scenes,'')}${tile('Your pace',S.settings.wpm,'wpm')}
    </div>
    ${d.moods.length?`<h2 class="h2" style="margin:20px 0 10px">Moods you read with most</h2><div style="display:flex;gap:8px;flex-wrap:wrap">${d.moods.map(m=>`<div style="display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;box-sizing:border-box;border-radius:18px;background:var(--raised);border:1px solid var(--line-2);font-size:14px"><span style="width:8px;height:8px;border-radius:4px;background:${m[2]}"></span>${m[0]}<span style="color:var(--fg-3)">${m[1]}%</span></div>`).join('')}</div>`:''}
    ${tabbar('stats')}
  </div>`;
}

  const active=document.activeElement&&document.activeElement.id;
  app.innerHTML=html;
  if(active){const el=document.getElementById(active);if(el&&el.tagName==='INPUT')el.focus()}
  if(S.view!=='player')S.lastCard=null;
}

/* ---------- actions ---------- */
const A={
  tab(id){go(id,false);S.stack=[]},
  nav(id){go(id)},
  back(){back()},
  startPace(from){S.pace={phase:'ready',secs:0,start:0,wpm:0,from:from};go('pace')},
  skipOnboard(){S.settings.onboarded=true;saveSettings();S.stack=[];go('home',false)},
  paceStart(){Sound.init();S.pace.phase='reading';S.pace.start=Date.now();S.pace.secs=0;render()},
  paceDone(){const secs=Math.max(1,(Date.now()-S.pace.start)/1000);S.pace.wpm=Math.min(600,Math.max(80,Math.round(58/(secs/60))));S.pace.phase='done';render()},
  paceReset(){S.pace.phase='ready';S.pace.secs=0;render()},
  paceAccept(){S.settings.wpm=S.pace.wpm;const onboard=S.pace.from==='onboard';S.settings.onboarded=true;saveSettings();
    if(onboard){S.stack=[];go('home',false)}else{back()}toast('Pace saved: '+S.pace.wpm+' words per minute')},
  openBook(id){S.bookId=id;S.pickCh=null;S.showAll=false;if(S.draft&&S.draft.status==='error')S.draft=null;go('book')},
  pickCh(n){S.pickCh=+n;if(S.draft&&S.draft.status==='error')S.draft=null;render()},
  showAll(){S.showAll=true;render()},
  draft(){draftMap()},
  stopDraft(){if(S.draft&&S.draft.ctl)S.draft.ctl.abort()},
  identify(){const q=S.query.trim();if(q)identifyBook(q)},
  stopAdd(){if(S.adding&&S.adding.ctl)S.adding.ctl.abort()},
  addManual(){
    const t=(document.getElementById('add-title')||{}).value||'',au=(document.getElementById('add-author')||{}).value||'',n=parseInt((document.getElementById('add-ch')||{}).value,10);
    if(!t.trim()){toast('Add the book’s title first.');return}
    addCustom(t.trim().slice(0,80),au.trim().slice(0,60)||'Unknown author',Math.max(1,Math.min(300,n||30)),false);
  },
  remood(id){
    const s=S.session;if(!s||!ALL[id])return;
    S.votes[s.book+'~'+s.ch+'~'+s.idx]=id;syncVotes();
    if(s.playing)playScene(2.5);
    render();toast('Changed to '+ALL[id].name+(canShare()?'. Your pick helps other readers.':'.'));
  },

  startCh(){openSession(S.bookId,S.pickCh);go('player')},
  resume(){const l=S.last;S.bookId=l.book;openSession(l.book,l.ch);go('player')},
  toggle(){togglePlay()},
  scene(i){setScene(+i);render()},
  prevScene(){setScene(S.session.idx-1);render()},
  nextScene(){setScene(S.session.idx+1);render()},
  nextCh(n){const s=S.session;openSession(s.book,+n);S.session.playing=false;togglePlay()},
  vote(v){const s=S.session,k=s.book+'~'+s.ch+'~'+s.idx;if(S.votes[k]===v)delete S.votes[k];else S.votes[k]=v;syncVotes();render()},
  hintOk(){S.hintDone=true;store.set('hintDone',true);render()},
  preview(id){
    if(S.preview===id){S.preview=null;Sound.stop(1)}
    else{if(S.session&&S.session.playing){S.session.playing=false;releaseWake();syncShelf()}S.preview=id;Sound.play(MOODS[id],null,1.5)}
    render();
  },
  period(p){S.period=p;render()},
  flip(k){S.settings[k]=!S.settings[k];saveSettings();if(k==='keepAwake'){if(!S.settings[k])releaseWake();else if(S.session&&S.session.playing)requestWake()}render()},
  clearQ(){S.query='';render();const q=document.getElementById('q');if(q)q.focus()},
  resetAsk(){S.confirmReset=true;render()},
  resetNo(){S.confirmReset=false;render()},
  resetYes(){store.clear();Sound.stop(.3);releaseWake();location.reload()}
};
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset.arg)}
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='q'){S.query=t.value;const r=document.getElementById('results');if(r)r.innerHTML=resultsHTML();const c=document.getElementById('q-clear');if(c)c.style.visibility=S.query?'visible':'hidden'}
  else if(t.id==='vol-music'||t.id==='vol-amb'){
    const key=t.id==='vol-music'?'music':'amb';S.settings[key]=+t.value;
    const lab=document.getElementById(t.id+'-v');if(lab)lab.textContent=t.value+'%';
    Sound.setVol(S.settings.music/100,S.settings.amb/100);saveSettings();
  }else if(t.id==='profile-name'){S.settings.name=t.value.slice(0,40);saveSettings()}
  else if(t.id==='draft-note'&&S.bookId){S.notes[S.bookId+'-'+S.pickCh]=t.value}
});
/* ruler: tap or drag to say where you are */
function rulerSet(e){
  const r=document.getElementById('ruler'),s=S.session;if(!r||!s)return;
  const rect=r.getBoundingClientRect(),f=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  s.pos=Math.min(s.total-1,f*s.total);s.done=false;
  const ni=sceneAt(s.scenes,s.pos);
  if(ni!==s.idx){setScene(ni,{keepPos:true});render()}else{livePlayer();syncShelf()}
}
let dragging=false;
document.addEventListener('pointerdown',e=>{if(e.target.closest('#ruler')){dragging=true;rulerSet(e)}});
document.addEventListener('pointermove',e=>{if(dragging)rulerSet(e)});
document.addEventListener('pointerup',()=>{dragging=false});
document.addEventListener('keydown',function(e){
  if(e.target.id!=='ruler'||!S.session)return;
  const s=S.session,step=WORDS_PER_PAGE;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();s.pos=Math.max(0,Math.min(s.total-1,s.pos+(e.key==='ArrowRight'?step:-step)));
    const ni=sceneAt(s.scenes,s.pos);if(ni!==s.idx){setScene(ni,{keepPos:true});render();const r=document.getElementById('ruler');if(r)r.focus()}else livePlayer()}
});
window.addEventListener('pagehide',()=>{saveStats();syncShelf()});

render();
})();
</script>
</body>
</html>
